<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ name }} | {{ course }}</title>
  <style>
    :root { --bg: #0b3d2e; --card: #ffffff; --accent: #275d38; --text: #1a1a1a; --muted: #555; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0b3d2e, #275d38 60%, #3f8f5a);
      color: var(--text); padding: 16px;
    }
    main {
      background: var(--card); border-radius: 16px; padding: 48px 40px;
      max-width: 480px; width: 100%; text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
    }
    .badge { font-size: 3rem; margin-bottom: 8px; }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    .label { color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; margin-top: 24px; }
    .value { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
    footer { margin-top: 32px; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <div class="badge" aria-hidden="true">☁️</div>
    <h1>{{ name }}</h1>
    <p class="label">UVU Student ID</p>
    <p class="value">{{ student_id }}</p>
    <p class="label">Course</p>
    <p class="value">{{ course }}</p>
    <footer>Flask app running in Docker on AWS EC2</footer>
  </main>
</body>
</html>
