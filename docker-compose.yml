# Student app + observability stack (Grafana Alloy, Prometheus, Loki, Grafana).
# Only the app (3000) and Grafana (3001) are published publicly; everything else
# binds to 127.0.0.1 on the host and is reachable only through an SSH tunnel.

services:
  app:
    build: .
    image: student-app:1.1.0
    ports:
      - "3000:3000"
    environment:
      ENABLE_SIMULATION: ${ENABLE_SIMULATION:-false}
    mem_limit: 128m
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.21.0
    # Used as the host label on logs and the instance label on host metrics
    hostname: it-3200-ec2
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    # Privileged + host mounts are required by the embedded cAdvisor and node exporters
    privileged: true
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:12345:12345"
    mem_limit: 256m
    restart: unless-stopped
    depends_on: [prometheus, loki]

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      # Alloy pushes metrics here instead of Prometheus scraping
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 256m
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    mem_limit: 256m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SECURITY_COOKIE_SAMESITE: strict
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    mem_limit: 256m
    restart: unless-stopped
    depends_on: [prometheus, loki]

volumes:
  alloy-data:
  prometheus-data:
  loki-data:
  grafana-data:
