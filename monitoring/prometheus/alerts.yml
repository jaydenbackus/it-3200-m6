groups:
  - name: student-app
    rules:
      - alert: StudentAppDown
        expr: up{job="student-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Student app is not responding to scrapes"
          description: "Alloy has failed to scrape the Flask app's /metrics endpoint for over 1 minute."

      - alert: StudentAppHighErrorRate
        expr: |
          sum(rate(flask_http_request_total{status=~"5.."}[5m]))
            / sum(rate(flask_http_request_total[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests are failing"
          description: "5xx error ratio is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: StudentAppHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(flask_http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency is above 1 second"
          description: "95th percentile request latency is {{ $value | humanizeDuration }}."

  - name: host
    rules:
      - alert: HostHighCpu
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "EC2 host CPU above 85%"
          description: "CPU usage is {{ $value | printf \"%.1f\" }}%."

      - alert: HostLowMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "EC2 host has less than 10% memory available"
          description: "Available memory is {{ $value | humanizePercentage }}."

      - alert: HostDiskAlmostFull
        expr: |
          node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Root disk has less than 15% free"
          description: "Free space on / is {{ $value | humanizePercentage }}."
