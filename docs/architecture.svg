<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="a-metric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6522c"/></marker>
    <marker id="a-log" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker>
    <marker id="a-query" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a3ffc"/></marker>
  </defs>

  <rect width="1280" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="44" font-size="24" font-weight="700" fill="#1a1a1a">Student App Observability on AWS EC2</text>
  <text x="40" y="68" font-size="14" fill="#555">Grafana Alloy collects everything · Prometheus stores metrics and evaluates alerts · Loki stores logs · Grafana visualizes</text>

  <!-- Outside actors -->
  <rect x="30" y="270" width="170" height="96" rx="10" fill="#f4f4f4" stroke="#777"/>
  <text x="115" y="300" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">Engineer</text>
  <text x="115" y="320" font-size="12" text-anchor="middle" fill="#555">"My IP" only</text>
  <text x="115" y="337" font-size="12" text-anchor="middle" fill="#555">browser + SSH key</text>
  <text x="115" y="354" font-size="12" text-anchor="middle" fill="#555">(ED25519)</text>

  <rect x="30" y="470" width="170" height="78" rx="10" fill="#f4f4f4" stroke="#777"/>
  <text x="115" y="500" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">Public users</text>
  <text x="115" y="520" font-size="12" text-anchor="middle" fill="#555">Internet (0.0.0.0/0)</text>
  <text x="115" y="537" font-size="12" text-anchor="middle" fill="#555">browser</text>

  <!-- Legend -->
  <g font-size="12" fill="#333">
    <rect x="22" y="610" width="180" height="150" rx="8" fill="#fafafa" stroke="#ddd"/>
    <text x="36" y="632" font-weight="700">Legend</text>
    <line x1="36" y1="652" x2="66" y2="652" stroke="#e6522c" stroke-width="3"/><text x="74" y="656">metrics</text>
    <line x1="36" y1="674" x2="66" y2="674" stroke="#2f6fde" stroke-width="3"/><text x="74" y="678">logs</text>
    <line x1="36" y1="696" x2="66" y2="696" stroke="#8a3ffc" stroke-width="3"/><text x="74" y="700">queries</text>
    <line x1="36" y1="718" x2="66" y2="718" stroke="#555" stroke-width="3"/><text x="74" y="722">user traffic</text>
    <line x1="36" y1="740" x2="66" y2="740" stroke="#d1242f" stroke-width="2" stroke-dasharray="6 4"/><text x="74" y="744">security boundary</text>
  </g>

  <!-- AWS boundary -->
  <rect x="240" y="90" width="1010" height="790" rx="14" fill="#fff8ef" stroke="#ff9900" stroke-width="2"/>
  <text x="260" y="116" font-size="15" font-weight="700" fill="#b36b00">AWS · us-west-1 (N. California)</text>

  <!-- Security group boundary -->
  <rect x="270" y="130" width="960" height="730" rx="12" fill="none" stroke="#d1242f" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="290" y="154" font-size="13" font-weight="700" fill="#d1242f">Security group it-3200-monitoring-sg · inbound: 22 My IP · 3000 0.0.0.0/0 · 3001 My IP · everything else denied</text>

  <!-- EC2 -->
  <rect x="300" y="170" width="910" height="670" rx="10" fill="#ffffff" stroke="#888"/>
  <text x="320" y="194" font-size="14" font-weight="700" fill="#1a1a1a">EC2 t3.small · Amazon Linux 2023 · Docker + Compose</text>

  <!-- Docker network -->
  <rect x="330" y="210" width="850" height="480" rx="10" fill="#eef5ff" stroke="#2f6fde" stroke-dasharray="5 4"/>
  <text x="350" y="232" font-size="13" font-weight="700" fill="#2f6fde">Docker Compose network (private 172.x)</text>

  <!-- Grafana -->
  <rect x="360" y="260" width="230" height="140" rx="10" fill="#ffffff" stroke="#8a3ffc" stroke-width="2"/>
  <text x="475" y="286" font-size="15" font-weight="700" text-anchor="middle" fill="#8a3ffc">Grafana</text>
  <text x="475" y="305" font-size="12" text-anchor="middle" fill="#333">host :3001 → container :3000</text>
  <text x="475" y="325" font-size="12" text-anchor="middle" fill="#333">admin password from .env</text>
  <text x="475" y="343" font-size="12" text-anchor="middle" fill="#333">sign-up + anonymous off</text>
  <text x="475" y="361" font-size="12" text-anchor="middle" fill="#333">provisioned datasources</text>
  <text x="475" y="379" font-size="12" text-anchor="middle" fill="#333">18-panel dashboard · alert list</text>

  <!-- App -->
  <rect x="360" y="440" width="230" height="140" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
  <text x="475" y="466" font-size="15" font-weight="700" text-anchor="middle" fill="#1a7f37">student-app</text>
  <text x="475" y="485" font-size="12" text-anchor="middle" fill="#333">Flask + gunicorn · :3000</text>
  <text x="475" y="505" font-size="12" text-anchor="middle" fill="#333">/  ·  /health</text>
  <text x="475" y="523" font-size="12" text-anchor="middle" fill="#333">/metrics (403 unless private IP)</text>
  <text x="475" y="541" font-size="12" text-anchor="middle" fill="#333">prometheus-flask-exporter</text>
  <text x="475" y="559" font-size="12" text-anchor="middle" fill="#333">access + app logs → stdout</text>

  <!-- Alloy -->
  <rect x="660" y="260" width="250" height="250" rx="10" fill="#ffffff" stroke="#f46800" stroke-width="2"/>
  <text x="785" y="286" font-size="15" font-weight="700" text-anchor="middle" fill="#f46800">Grafana Alloy</text>
  <text x="785" y="304" font-size="12" text-anchor="middle" fill="#555">privileged · UI on 127.0.0.1:12345</text>
  <g font-size="12" fill="#333">
    <text x="676" y="331">prometheus.scrape "student_app"</text>
    <text x="676" y="351">prometheus.exporter.unix (node)</text>
    <text x="676" y="371">prometheus.exporter.cadvisor</text>
    <text x="676" y="391">prometheus.exporter.self</text>
    <text x="676" y="411">prometheus.scrape "stack"</text>
    <text x="676" y="435">discovery.docker + relabel</text>
    <text x="676" y="455">loki.source.docker</text>
    <text x="676" y="475">loki.process "redact" (secrets)</text>
    <text x="676" y="497" fill="#555">→ remote_write · loki.write</text>
  </g>

  <!-- Prometheus -->
  <rect x="970" y="260" width="190" height="150" rx="10" fill="#ffffff" stroke="#e6522c" stroke-width="2"/>
  <text x="1065" y="286" font-size="15" font-weight="700" text-anchor="middle" fill="#e6522c">Prometheus</text>
  <text x="1065" y="305" font-size="12" text-anchor="middle" fill="#333">127.0.0.1:9090</text>
  <text x="1065" y="325" font-size="12" text-anchor="middle" fill="#333">remote-write receiver</text>
  <text x="1065" y="343" font-size="12" text-anchor="middle" fill="#333">TSDB · 15 d / 2 GB cap</text>
  <text x="1065" y="361" font-size="12" text-anchor="middle" fill="#333">6 alert rules</text>
  <text x="1065" y="379" font-size="12" text-anchor="middle" fill="#333">app down · errors · latency</text>
  <text x="1065" y="397" font-size="12" text-anchor="middle" fill="#333">CPU · memory · disk</text>

  <!-- Loki -->
  <rect x="970" y="440" width="190" height="100" rx="10" fill="#ffffff" stroke="#2f6fde" stroke-width="2"/>
  <text x="1065" y="466" font-size="15" font-weight="700" text-anchor="middle" fill="#2f6fde">Loki</text>
  <text x="1065" y="485" font-size="12" text-anchor="middle" fill="#333">127.0.0.1:3100</text>
  <text x="1065" y="504" font-size="12" text-anchor="middle" fill="#333">filesystem · TSDB index</text>
  <text x="1065" y="522" font-size="12" text-anchor="middle" fill="#333">7-day retention</text>

  <!-- Host layer -->
  <rect x="330" y="715" width="850" height="110" rx="10" fill="#f6f6f6" stroke="#888"/>
  <text x="350" y="812" font-size="13" font-weight="700" fill="#333">EC2 host · sshd :22 · read-only mounts into Alloy</text>
  <g font-size="12" fill="#333">
    <rect x="350" y="726" width="190" height="56" rx="6" fill="#fff" stroke="#aaa"/>
    <text x="445" y="749" text-anchor="middle">/var/run/docker.sock</text>
    <text x="445" y="767" text-anchor="middle">discovery + container logs</text>
    <rect x="560" y="726" width="180" height="56" rx="6" fill="#fff" stroke="#aaa"/>
    <text x="650" y="749" text-anchor="middle">/proc · /sys · /</text>
    <text x="650" y="767" text-anchor="middle">CPU · mem · disk · net</text>
    <rect x="760" y="726" width="200" height="56" rx="6" fill="#fff" stroke="#aaa"/>
    <text x="860" y="749" text-anchor="middle">cgroups · /var/lib/docker</text>
    <text x="860" y="767" text-anchor="middle">per-container CPU / memory</text>
    <rect x="980" y="726" width="180" height="56" rx="6" fill="#fff" stroke="#aaa"/>
    <text x="1070" y="749" text-anchor="middle">Docker volumes</text>
    <text x="1070" y="767" text-anchor="middle">TSDB · chunks · grafana.db</text>
  </g>

  <!-- ===== Flows ===== -->
  <!-- engineer -> grafana -->
  <path d="M200,318 L356,318" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a-gray)"/>
  <text x="204" y="310" font-size="11" fill="#555">HTTP :3001</text>
  <!-- engineer SSH tunnel -> host sshd -->
  <path d="M200,352 L222,352 L222,755 L326,755" stroke="#555" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#a-gray)"/>
  <text x="216" y="720" font-size="11" fill="#555" transform="rotate(-90 216 720)">SSH :22 · tunnel to 127.0.0.1:9090 / :12345</text>

  <!-- users -> app -->
  <path d="M200,509 L356,509" stroke="#555" stroke-width="2" fill="none" marker-end="url(#a-gray)"/>
  <text x="204" y="501" font-size="11" fill="#555">HTTP :3000</text>

  <!-- alloy scrapes app -->
  <path d="M660,478 L594,478" stroke="#e6522c" stroke-width="2.4" fill="none" marker-end="url(#a-metric)"/>
  <text x="600" y="469" font-size="11" fill="#e6522c">scrape</text>
  <text x="600" y="494" font-size="11" fill="#e6522c">15 s</text>

  <!-- app stdout -> docker logs -->
  <path d="M445,580 L445,722" stroke="#2f6fde" stroke-width="2" fill="none" marker-end="url(#a-log)"/>
  <text x="340" y="650" font-size="11" fill="#2f6fde">stdout →</text>
  <text x="340" y="665" font-size="11" fill="#2f6fde">json-file</text>

  <!-- host -> alloy -->
  <path d="M520,726 L700,514" stroke="#2f6fde" stroke-width="2" fill="none" marker-end="url(#a-log)"/>
  <path d="M650,726 L780,514" stroke="#e6522c" stroke-width="2" fill="none" marker-end="url(#a-metric)"/>
  <path d="M860,726 L860,514" stroke="#e6522c" stroke-width="2" fill="none" marker-end="url(#a-metric)"/>
  <text x="870" y="640" font-size="11" fill="#555">host metrics,</text>
  <text x="870" y="655" font-size="11" fill="#555">container metrics</text>
  <text x="870" y="670" font-size="11" fill="#555">+ container logs</text>

  <!-- alloy -> prometheus / loki -->
  <path d="M910,335 L966,335" stroke="#e6522c" stroke-width="2.4" fill="none" marker-end="url(#a-metric)"/>
  <text x="914" y="325" font-size="11" fill="#e6522c">remote</text>
  <text x="914" y="352" font-size="11" fill="#e6522c">write</text>
  <path d="M910,490 L966,490" stroke="#2f6fde" stroke-width="2.4" fill="none" marker-end="url(#a-log)"/>
  <text x="916" y="482" font-size="11" fill="#2f6fde">push</text>

  <!-- prometheus + loki -> grafana (queries) -->
  <path d="M1160,490 L1170,490 L1170,246 L475,246 L475,256" stroke="#8a3ffc" stroke-width="2" fill="none" marker-end="url(#a-query)"/>
  <path d="M1065,260 L1065,246" stroke="#8a3ffc" stroke-width="2" fill="none"/>
  <text x="700" y="241" font-size="11" fill="#8a3ffc">Grafana queries: PromQL (metrics + alert state) · LogQL (logs)</text>
</svg>
